version: '3.8'

services:

  # 1. Base de Datos PostgreSQL 17
  postgres_db:
    image: postgres:17-alpine
    container_name: db_analisis_financiero
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_net

  # 2. Control de Migraciones con Flyway
  flyway:
    image: flyway/flyway:9.16.0
    container_name: flyway_migrator
    command:
      - -url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
      - -user=${DB_USER}
      - -password=${DB_PASSWORD}
      - -connectRetries=10
      - migrate
    volumes:
      - ./backend/db/migrations:/flyway/sql
    depends_on:
      - postgres_db
    networks:
      - app_net

  # 3. Backend (FastAPI)
  backend:
    build: ./backend
    container_name: api_analisis_financiero
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - postgres_db
    networks:
      - app_net

  # 4. Airflow Inicializador
  airflow-init:
    image: apache/airflow:2.7.1
    container_name: airflow_init
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres_db:5432/${DB_NAME}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      _AIRFLOW_DB_UPGRADE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    depends_on:
      - postgres_db
    networks:
      - app_net


  # 5. Airflow Webserver
  airflow-webserver:
    image: apache/airflow:2.7.1
    container_name: airflow_webserver
    restart: always
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres_db:5432/${DB_NAME}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PIP_ADDITIONAL_REQUIREMENTS: pandas psycopg2-binary sqlalchemy
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./backend:/opt/airflow/backend
      - ./datos_historicos.csv:/opt/airflow/datos/datos_historicos.csv
    command: webserver
    depends_on:
      - postgres_db
      - airflow-init
    networks:
      - app_net

  # 6. Airflow Scheduler
  airflow-scheduler:
    image: apache/airflow:2.7.1
    container_name: airflow_scheduler
    restart: always
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@postgres_db:5432/${DB_NAME}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PIP_ADDITIONAL_REQUIREMENTS: pandas psycopg2-binary sqlalchemy
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./backend:/opt/airflow/backend
      - ./datos_historicos.csv:/opt/airflow/datos/datos_historicos.csv
    command: scheduler
    depends_on:
      - postgres_db
      - airflow-init
    networks:
      - app_net

# 7. Metabase (BI y Gráficas)
  metabase:
    image: metabase/metabase:latest
    container_name: metabase_dashboard
    ports:
      - "3030:3000"
    depends_on:
      - postgres_db
    networks:
      - app_net

volumes:
  postgres_data:


networks:
  app_net:
    driver: bridge



  